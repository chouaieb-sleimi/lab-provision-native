---
host_vars:
  # connection info
  ansible_connection: smart
  home_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}"
  ssh_key_name: id_ed25519.pub
  ssh_key: "{{ home_dir }}/.ssh/{{ ssh_key_name }}"

  # vm spec variables
  virt_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
  virt_group: "{{ lookup('ansible.builtin.env', 'USER') }}"
  libvirt_pool_dir: "{{ home_dir }}/tech/vms"
  libvirt_image_dir: "{{ home_dir }}/tech/storage/os"
  base_image_name: "rhel-9.3-x86_64-kvm.qcow2"
  vm_vcpus: 1
  vm_ram_mb: 2048
  vm_net: "network_labs"

  # guest variables
  root_pass: "root"
  domain: "ansible.labs.homestation"
  vm_list:
    - vm_name: "control-rhel-9.3"
      hostname: "control"
      base_image_name: "rhel-9.3-x86_64-kvm.qcow2"
    - vm_name: "managed_1-alma9.1"
      hostname: "managed1"
      base_image_name: "AlmaLinux-9-GenericCloud-9.1-20221118.x86_64.qcow2"

guest_vars:
  configure_hosts: true
  home_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}"

  # tasks variables
  copy_hosts_file: true
  copy_ssh_key: true
  speedup_dnf: true
  max_parallel_downloads: 5

  # package operations
  install_packages: false
  update_host: false
  clean_subscription: false

  # secrets
  user_name: admin
  user_pass: admin
  redhat_username: redhat_access_login
  redhat_password: redhat_access_pass